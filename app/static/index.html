<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>Interview Coach</title>
    <style>
        body { background:#12141a; color:#e6e6e6; font-family:system-ui,sans-serif;
               max-width:760px; margin:60px auto; padding:0 20px; }
        h1 { font-size:20px; font-weight:600; }
        input { width:100%; padding:12px; border-radius:8px; border:1px solid #333;
                background:#1b1e26; color:#e6e6e6; font-size:14px; box-sizing:border-box; }
        button { margin-top:12px; padding:10px 22px; border:none; border-radius:8px;
                 background:#3b82f6; color:#fff; font-size:14px; cursor:pointer; }
        button:disabled { background:#2b3444; cursor:not-allowed; }
        #out { margin-top:24px; padding:18px; background:#1b1e26; border-radius:10px;
               min-height:80px; line-height:1.9; white-space:pre-wrap; font-size:15px; }
    </style>
</head>
<body>
    <h1>面试出题</h1>
    <input id="jd" placeholder="粘贴岗位 JD，例如：Python backend with FastAPI">
    <button id="btn">生成题目</button>
    <div id="out">等待生成...</div>

    <script>
        const btn = document.getElementById("btn");
        const out = document.getElementById("out");

        btn.onclick = () => {
            const jd = document.getElementById("jd").value.trim();
            if (!jd) { out.textContent = "先填 JD"; return; }

            out.textContent = "";
            btn.disabled = true;

            const url = "/generate-question?jd=" + encodeURIComponent(jd);
            const es = new EventSource(url);

            es.onmessage = (e) => { out.textContent += e.data; };
            es.onerror = () => { es.close(); btn.disabled = false; };
        };
    </script>
</body>
</html>
